name: finance_ai_assistant
description: "Aria — agentic finance AI demo."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core Firebase (floor bumped from spec's ^4.5.0; firebase_ai 3.10.x requires ^4.6.0)
  firebase_core: ^4.6.0

  # STAGE 1 — LangChain.dart + Gemini via Firebase Vertex AI
  langchain: ^0.8.1
  langchain_firebase: ^0.3.2       # ChatFirebaseVertexAI; pulls firebase_auth + firebase_app_check transitively

  # STAGE 2 — genui (backend-agnostic since 0.8.0) + firebase_ai as transport
  # NOTE: genui_firebase_ai is discontinued; do NOT add it.
  genui: ^0.9.2                     # PIN EXACT — alpha
  # PIN EXACT 3.4.0: langchain_firebase 0.3.2 (Stage 1, latest) maps FinishReason
  # with an exhaustive switch that only handles the pre-3.5.0 enum. firebase_ai
  # 3.5.0 added `malformedFunctionCall` (3.12.x added ~12 more), which makes
  # langchain_firebase 0.3.2 fail to compile. 3.4.0 is the only firebase_ai that
  # both satisfies its `^3.4.0` constraint and compiles. Do NOT bump without a
  # newer langchain_firebase that widens the switch.
  firebase_ai: 3.4.0              # direct Gemini calls for Stage 2 transport + smoke test
  json_schema_builder: ^0.1.3      # catalog widget schemas

  # State / navigation
  flutter_riverpod: ^3.3.1
  go_router: ^17.3.0

  # Device / storage
  sqflite: ^2.4.0
  device_calendar: ^4.3.0
  path: ^1.9.0

  # Logging
  logging: ^1.3.0

dependency_overrides:
  # firebase_app_check is a TRANSITIVE dep (langchain_firebase requires it); we
  # don't use App Check at runtime. The auto-resolved 0.4.3 has a Kotlin plugin
  # class whose build.gradle skips applying kotlin-android under AGP 9 (assuming
  # built-in Kotlin) — but this project sets android.builtInKotlin=false, so that
  # class never compiles and the Android build fails ("cannot find symbol
  # FirebaseAppCheckPlugin"). The proper fix (0.4.4+2) needs firebase_core_
  # platform_interface ^7, which conflicts with firebase_ai 3.4.0 (^6). So we pin
  # to 0.4.2: its plugin class is plain Java (no Kotlin → no AGP-9 issue) and it
  # uses platform_interface ^6 (compatible). No gradle.properties change needed.
  firebase_app_check: 0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.1

flutter:
  uses-material-design: true
